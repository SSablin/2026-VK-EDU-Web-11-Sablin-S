<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AskMe — главная</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="icon" href="static/img/favicon.ico">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- ШАПКА -->
    <header class="bg-white border-bottom py-3">
        <div class="container d-flex align-items-center gap-3">
            <a href="index.html" class="fs-4 fw-bold text-decoration-none">AskMe</a>

            <input type="search" class="form-control" placeholder="Поиск...">

            <a href="ask.html" class="btn btn-primary text-nowrap">Задать вопрос</a>

            <div class="d-flex align-items-center gap-2">
                <img src="static/img/avatar.png" alt="" width="40" height="40" class="rounded-circle bg-secondary">
                <span>Иван</span>
            </div>
        </div>
    </header>

    <!-- ОСНОВНАЯ ЧАСТЬ -->
    <div class="container my-4 flex-grow-1">
        <div class="row g-4">

            <form class="mt-4">
                <label for="answer" class="form-label fw-bold">Ваш ответ</label>
                <textarea id="answer" class="form-control mb-2" rows="5"></textarea>
                <button class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>


    <!-- ПОДВАЛ -->
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-muted small">
            © AskMe, 2026
        </div>
    </footer>

    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>

</html>
